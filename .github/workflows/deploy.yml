name: Build and deploy al-folio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install nbconvert
      - name: Audit configuration
        run: bundle exec al-folio upgrade audit --no-fail
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Verify generated pages
        run: |
          test -s _site/index.html
          test -s _site/publications/index.html
          test -s _site/projects/index.html
          test -s _site/cv/index.html
          test ! -e _site/backup
          test ! -e _site/templates
          if grep -R -E 'Albert Einstein|you@example.com|/al-folio/assets' _site --include='*.html'; then exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
